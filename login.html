<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vos JSP — Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <button type="button" class="menu-btn" id="menu-open" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a href="index.html" class="brand">
        <span class="brand-dot"></span>
        <div>VOS <span>JSP</span></div>
      </a>
    </div>
    <a href="index.html" class="btn btn-secondary btn-small">Accueil</a>
  </div>

  <div class="nav-backdrop" id="nav-backdrop"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <a href="index.html" class="brand" style="box-shadow:none; border:none; padding:0.25rem;">
        <span class="brand-dot"></span>
        <div>VOS <span>JSP</span></div>
      </a>
      <button type="button" class="close-btn" id="menu-close" aria-label="Fermer le menu">&times;</button>
    </div>

    <div class="drawer-label">Navigation</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="actus.html">Actualités</a>
      <a href="galerie.html">Galerie</a>
      <a href="proposer.html">Proposer</a>
      <a href="a-propos.html">À propos</a>
      <a href="contester.html">Contester</a>
      <a href="forum.html">Forum</a>
    </nav>

    <a href="login.html" class="btn active">Connexion</a>
  </aside>

  <main>
    <div class="card" style="max-width: 480px; margin: 2rem auto;">
      <span class="card-meta">Espace membre</span>
      <h1 id="auth-heading" style="font-size: 1.7rem; margin: 0.35rem 0 0.25rem;">Connexion</h1>
      <p id="auth-sub" style="color: var(--muted); font-size: 0.92rem; margin-top: 0;">Connecte-toi à ton compte Vos JSP.</p>

      <div id="auth-alert" class="alert"></div>

      <form id="auth-form">
        <div class="form-group" id="pseudo-group" style="display: none;">
          <label for="auth-pseudo">Pseudo</label>
          <input type="text" id="auth-pseudo" placeholder="Ton pseudo">
        </div>

        <div class="form-group">
          <label for="auth-email">Adresse e-mail</label>
          <input type="email" id="auth-email" placeholder="exemple@mail.com" required>
        </div>

        <div class="form-group">
          <label for="auth-password">Mot de passe</label>
          <input type="password" id="auth-password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="auth-submit" class="btn" style="width: 100%;">Se connecter</button>
      </form>

      <div style="margin-top: 1rem; text-align: center;">
        <button type="button" id="toggle-mode-btn" class="btn btn-secondary btn-small" style="width: 100%;">Créer un compte</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <div>
        <strong>Vos JSP</strong> — Plateforme communautaire indépendante dédiée aux Jeunes Sapeurs-Pompiers.
      </div>
      <div class="footer-links">
        <a href="mentions-legales.html">Mentions légales</a>
        <a href="confidentialite.html">Confidentialité</a>
        <a href="a-propos.html">Contact</a>
      </div>
    </div>
  </footer>

  <script>
    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('nav-backdrop');
    document.getElementById('menu-open').addEventListener('click', () => {
      drawer.classList.add('open');
      backdrop.classList.add('open');
    });
    function closeDrawer() {
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
    }
    document.getElementById('menu-close').addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);
  </script>

  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import {
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import {
      doc,
      getDoc,
      setDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const headingEl = document.getElementById('auth-heading');
    const subEl = document.getElementById('auth-sub');
    const alertEl = document.getElementById('auth-alert');
    const formEl = document.getElementById('auth-form');
    const pseudoGroup = document.getElementById('pseudo-group');
    const pseudoInput = document.getElementById('auth-pseudo');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const submitBtn = document.getElementById('auth-submit');
    const toggleBtn = document.getElementById('toggle-mode-btn');

    let isRegisterMode = false;
    let userUnsubscribe = null;

    function showAlert(msg, isSuccess = false) {
      alertEl.style.display = 'block';
      alertEl.className = isSuccess ? 'alert success' : 'alert';
      alertEl.textContent = msg;
    }

    function sanitizeIpDocId(ip) {
      return String(ip || '').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    async function fetchPublicIp() {
      try {
        const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
        if (!res.ok) return '';
        const data = await res.json();
        return data && data.ip ? String(data.ip).trim() : '';
      } catch (_) {
        return '';
      }
    }

    async function redirectIfIpBanned() {
      const ip = await fetchPublicIp();
      if (!ip) return false;
      try {
        const snap = await getDoc(doc(db, "banned_ips", sanitizeIpDocId(ip)));
        if (snap.exists()) {
          window.location.replace('ban.html');
          return true;
        }
      } catch (_) {}
      return false;
    }

    toggleBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      alertEl.style.display = 'none';
      if (isRegisterMode) {
        headingEl.textContent = 'Inscription';
        subEl.textContent = 'Crée ton compte membre Vos JSP.';
        pseudoGroup.style.display = 'block';
        pseudoInput.required = true;
        submitBtn.textContent = 'Créer mon compte';
        toggleBtn.textContent = 'J’ai déjà un compte';
      } else {
        headingEl.textContent = 'Connexion';
        subEl.textContent = 'Connecte-toi à ton compte Vos JSP.';
        pseudoGroup.style.display = 'none';
        pseudoInput.required = false;
        submitBtn.textContent = 'Se connecter';
        toggleBtn.textContent = 'Créer un compte';
      }
    });

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';

      if (await redirectIfIpBanned()) return;

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const pseudo = pseudoInput.value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = isRegisterMode ? 'Création...' : 'Connexion...';

      try {
        const currentIp = await fetchPublicIp();

        if (isRegisterMode) {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          const finalPseudo = pseudo || email.split('@')[0];
          await updateProfile(cred.user, { displayName: finalPseudo });
          await setDoc(doc(db, "users", cred.user.uid), {
            pseudo: finalPseudo,
            email,
            role: 'membre',
            banned: false,
            lastIp: currentIp,
            createdAt: serverTimestamp(),
            lastLoginAt: serverTimestamp()
          }, { merge: true });
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          const userRef = doc(db, "users", cred.user.uid);
          const snap = await getDoc(userRef);

          if (snap.exists() && snap.data().banned === true) {
            window.location.replace('ban.html');
            return;
          }

          const patch = {
            email,
            lastLoginAt: serverTimestamp()
          };
          if (currentIp) patch.lastIp = currentIp;
          if (!snap.exists()) {
            patch.pseudo = cred.user.displayName || email.split('@')[0];
            patch.role = 'membre';
            patch.banned = false;
          }
          await setDoc(userRef, patch, { merge: true });
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = isRegisterMode ? 'Créer mon compte' : 'Se connecter';
        showAlert('Erreur : ' + (err.code || err.message));
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (userUnsubscribe) {
        userUnsubscribe();
        userUnsubscribe = null;
      }

      if (await redirectIfIpBanned()) return;
      if (!user) return;

      userUnsubscribe = onSnapshot(doc(db, "users", user.uid), (snap) => {
        if (snap.exists() && snap.data().banned === true) {
          window.location.replace('ban.html');
        } else {
          window.location.replace('index.html');
        }
      });
    });
  </script>
</body>
</html>
